<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Infinite Dungeon</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Backend API base URL – hard-coded for Render deployment; replaced at build time. -->
  <script>window.API_BASE = 'https://infinite-dungeon-ujbn.onrender.com';</script>

  <!-- Game UI: flex layout with main content area and collapsible history sidebar. -->
  <div class="game-container">
    <!-- Main content: header, current scene, options, loading/error indicators. -->
    <div class="game-main">
      <!-- Top bar: exit link, depth counter, return-to-start button, user indicator. -->
      <div class="game-header">
        <a href="./" class="btn small">&larr; Exit Dungeon</a>
        <span class="scene-counter">Depth: <span id="depthCounter">0</span></span>
        <div class="header-actions">
          <button class="btn small" id="btnReturnStart">Return to Start</button>
          <span class="user-indicator" id="userIndicator">Guest</span>
        </div>
      </div>

      <!-- The current scene text (populated by game.js). -->
      <div class="current-scene" id="currentScene">
      </div>

      <!-- Option buttons (populated by game.js). -->
      <div class="options-list" id="optionsList">
      </div>

      <!-- "Generating..." indicator (shown while the LLM works). -->
      <div class="loading-indicator hidden" id="loadingIndicator">
        <span class="cursor-blink">&#x2588;</span> Generating next scene...
      </div>

      <!-- Error banner. -->
      <div class="error-message hidden" id="errorMessage"></div>
    </div>

    <!-- Collapsible history sidebar: shows past scenes and choices. -->
    <div class="history-sidebar collapsed" id="historySidebar">
      <button class="history-toggle" id="historyToggle" aria-label="Toggle history">&laquo; History</button>
      <div class="scene-history" id="sceneHistory">
      </div>
    </div>
  </div>

  <!-- Client-side scripts. -->
  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
